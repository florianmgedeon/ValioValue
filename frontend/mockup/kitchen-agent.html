<meta charset="utf-8">
<title>Kitchen Agent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: app shell. Sticky header with three tabs (Order / Activity / Kitchen), sticky composer.
   Order has two modes: start (photo + usual order) and "this order" (thread + live status aside). */
:root{
  --bg:#ffffff; --surface:#f5f5f7; --surface2:#ececf0; --line:#e3e3e8; --ink:#1d1d1f; --ink2:#515154; --ink3:#6e6e73;
  --accent:#0a66d8; --accent-soft:#e8f0fc;
  --must:#c4291c; --must-soft:#fdecea;
  --prefer:#1b7f3b; --prefer-soft:#e8f7ec;
  --usual:#5b3fd1; --usual-soft:#efebfd;
  --about:#515154; --about-soft:#efeff2;
  --auto:#a35c00; --auto-soft:#fdf2e2;
  --paper:#fffdf6; --paper-ink:#2b2a26; --paper-line:#dfe6f2;
  --hl-must:rgba(196,41,28,.18); --hl-prefer:rgba(27,127,59,.18); --hl-usual:rgba(91,63,209,.18); --hl-about:rgba(81,81,84,.16); --hl-auto:rgba(163,92,0,.2);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.07);
  --shadow-lg:0 2px 6px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.14);
  --font:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --hand:Caveat,"Bradley Hand","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#1c1c1f; --surface2:#26262a; --line:#2e2e33; --ink:#f5f5f7; --ink2:#c7c7cc; --ink3:#98989f;
  --accent:#4c9bff; --accent-soft:#16263d;
  --must:#ff6a5c; --must-soft:#3a1715; --prefer:#4cc777; --prefer-soft:#12301d; --usual:#a594ff; --usual-soft:#241d44;
  --about:#c7c7cc; --about-soft:#26262a; --auto:#f0a640; --auto-soft:#3a2810;
  --paper:#f4f1e6; --paper-ink:#2b2a26; --paper-line:#d6deea;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1c1c1f; --surface2:#26262a; --line:#2e2e33; --ink:#f5f5f7; --ink2:#c7c7cc; --ink3:#98989f;
  --accent:#4c9bff; --accent-soft:#16263d;
  --must:#ff6a5c; --must-soft:#3a1715; --prefer:#4cc777; --prefer-soft:#12301d; --usual:#a594ff; --usual-soft:#241d44;
  --about:#c7c7cc; --about-soft:#26262a; --auto:#f0a640; --auto-soft:#3a2810;
  --paper:#f4f1e6; --paper-ink:#2b2a26; --paper-line:#d6deea;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@keyframes rise{from{opacity:.001;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes scan{from{top:-10%}to{top:100%}}
@keyframes flash{from{opacity:.9}to{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .15s ease,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.ghost:hover{background:var(--surface2)}
.btn.small{height:34px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:6px;font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand small{font-weight:500;color:var(--ink3);font-size:13px;letter-spacing:0}
.tabs{display:flex;gap:2px;background:var(--surface);padding:3px;border-radius:999px;margin-left:8px}
.tabs button{height:32px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spacer{flex:1}
.autopill{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px 0 10px;border-radius:999px;background:var(--auto-soft);color:var(--auto);font-size:13px;font-weight:600;white-space:nowrap}
.autopill .bar{display:flex;gap:2px}
.autopill .bar i{width:6px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--auto) 25%,transparent)}
.autopill .bar i.on{background:var(--auto)}
.who{display:flex;align-items:center;gap:8px;height:36px;padding:0 4px 0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700}
@media (max-width:960px){.autopill .txt,.who .nm,.brand small{display:none}}
@media (max-width:600px){.top-in{gap:8px}.autopill .bar,.autopill svg,.brand{display:none}.tabs{margin-left:0}.tabs button{padding:0 10px}.who{padding:0;border:0}}

.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- onboarding ---------- */
.ob{padding-block:48px 140px}
.ob-hero{text-align:center;max-width:760px;margin:0 auto;display:grid;gap:14px}
.ob-hero .eyebrow{color:var(--accent);letter-spacing:.02em;text-transform:none;font-size:13px}
.ob-hero h1{font-size:clamp(34px,5vw,56px);line-height:1.04;font-weight:800}
.ob-hero p{color:var(--ink2);font-size:17px;max-width:600px;margin:0 auto}
.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,.7fr);gap:18px;margin-top:40px;align-items:start}
@media (max-width:1000px){.docs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.docs{grid-template-columns:minmax(0,1fr)}}
.doc{display:grid;gap:10px}
.doc-frame{position:relative;border-radius:18px;overflow:hidden;background:var(--surface);padding:18px;aspect-ratio:4/5;max-width:100%;box-shadow:var(--shadow)}
.doc-frame.reading::after,.photo-msg.reading::after{content:"";position:absolute;left:0;right:0;height:18%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 22%,transparent),transparent);animation:scan 1.5s linear infinite}
.doc-meta{display:flex;align-items:center;gap:10px}
.doc-meta b{font-size:14px}
.doc-meta .muted{font-size:12px}
.status{margin-left:auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--ink3);white-space:nowrap}
.status.read{background:var(--prefer-soft);color:var(--prefer)}
.status.busy{background:var(--accent-soft);color:var(--accent);animation:pulse 1.2s infinite}
.drop{border:2px dashed var(--line);border-radius:18px;aspect-ratio:4/5;max-width:100%;display:grid;place-content:center;gap:12px;text-align:center;padding:16px;color:var(--ink3)}
.drop .btn{margin:0 auto}
.drop p{font-size:13px}

.paper{height:100%;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px 16px 12px;font-size:11.5px;line-height:1.5;box-shadow:0 1px 0 rgba(0,0,0,.05),0 10px 24px rgba(0,0,0,.08);overflow:hidden;position:relative}
.paper.tilt-l{transform:rotate(-1.6deg)}
.paper.tilt-r{transform:rotate(1.2deg)}
.paper h4{margin:0 0 6px;font-size:13px;letter-spacing:.02em}
.paper .row{display:flex;gap:6px}
.paper .row span:first-child{font-weight:700;width:30px;flex:none}
.paper.hand{font-family:var(--hand);font-size:19px;line-height:1.25;background:repeating-linear-gradient(var(--paper),var(--paper) 23px,var(--paper-line) 24px);padding-top:20px}
.paper.hand .tape{position:absolute;top:-6px;left:50%;width:70px;height:20px;transform:translateX(-50%) rotate(-3deg);background:rgba(240,214,140,.75)}
.paper.inv{font-size:10.5px}
.paper.inv table{width:100%;border-collapse:collapse}
.paper.inv td{padding:3px 0;border-bottom:1px solid #e9e6da;vertical-align:top}
.paper.inv td:last-child{text-align:right;white-space:nowrap}
mark{background:transparent;color:inherit;border-radius:3px;padding:0 2px;margin:0 -2px;transition:background .4s,box-shadow .4s}
mark.on.k-must{background:var(--hl-must);box-shadow:0 0 0 1.5px rgba(196,41,28,.55)}
mark.on.k-prefer{background:var(--hl-prefer);box-shadow:0 0 0 1.5px rgba(27,127,59,.55)}
mark.on.k-usual{background:var(--hl-usual);box-shadow:0 0 0 1.5px rgba(91,63,209,.55)}
mark.on.k-about{background:var(--hl-about);box-shadow:0 0 0 1.5px rgba(81,81,84,.45)}
mark.on.k-auto{background:var(--hl-auto);box-shadow:0 0 0 1.5px rgba(163,92,0,.55)}
mark.focus{outline:3px solid var(--paper-ink);outline-offset:2px}

.ob-actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.tell{max-width:640px;margin:22px auto 0;display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:999px;padding:6px 6px 6px 18px}
.tell input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);height:36px}
.tell input:focus{outline:none}

.learned{margin-top:56px;display:grid;gap:18px}
.learned-head{display:flex;align-items:end;gap:16px;flex-wrap:wrap}
.learned-head h2{font-size:30px;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.cards{grid-template-columns:minmax(0,1fr)}}
.lc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px;border-radius:16px;background:var(--bg);border:1px solid var(--line);transition:border-color .2s,opacity .2s}
.lc:hover{border-color:var(--ink3)}
.lc.rejected{opacity:.45}
.lc.rejected .lc-title{text-decoration:line-through}
.lc-title{font-weight:600;font-size:15px}
.lc-src{font-size:12.5px;color:var(--ink3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.quote{font-family:var(--hand);font-size:17px;color:var(--ink2);line-height:1}
.lc-sub{font-size:12.5px;color:var(--ink2);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.yn{display:flex;gap:6px}
.yn button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink3)}
.yn button.y[aria-pressed="true"]{background:var(--prefer);color:#fff}
.yn button.n[aria-pressed="true"]{background:var(--ink3);color:var(--bg)}
.kind{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:4px 8px;border-radius:6px;white-space:nowrap}
.k-must.kind,.chip.k-must{background:var(--must-soft);color:var(--must)}
.k-prefer.kind,.chip.k-prefer{background:var(--prefer-soft);color:var(--prefer)}
.k-usual.kind,.chip.k-usual{background:var(--usual-soft);color:var(--usual)}
.k-about.kind,.chip.k-about{background:var(--about-soft);color:var(--about)}
.k-auto.kind,.chip.k-auto{background:var(--auto-soft);color:var(--auto)}
.signed{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink3)}
.signed svg{width:13px;height:13px}
.adopt{position:sticky;bottom:16px;margin-top:8px;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 22px;border-radius:28px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lg);flex-wrap:wrap}
.adopt p{font-size:14px;flex:1;min-width:200px}
.adopt .btn.primary{background:var(--bg);color:var(--ink)}

/* ---------- order: start mode ---------- */
.order{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;padding-block:28px 190px;align-items:start}
@media (max-width:1000px){.order{grid-template-columns:minmax(0,1fr)}}
.thread{display:grid;gap:18px;min-width:0}
.aside{position:sticky;top:88px;display:grid;gap:14px}
@media (max-width:1000px){.aside{position:static}}
.panel{background:var(--surface);border-radius:20px;padding:20px;display:grid;gap:12px}
.hello h1{font-size:clamp(30px,4vw,44px);font-weight:800;line-height:1.05}
.hello>p{color:var(--ink2);font-size:16px;margin-top:8px}
.starters{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;margin-top:24px}
@media (max-width:760px){.starters{grid-template-columns:minmax(0,1fr)}}
.photo-card{position:relative;overflow:hidden;text-align:left;display:grid;gap:12px;align-content:space-between;padding:22px;border-radius:22px;background:var(--ink);color:var(--bg);min-height:300px;transition:transform .2s}
.photo-card:hover{transform:translateY(-3px)}
.photo-card h2{font-size:26px;font-weight:800;line-height:1.1}
.photo-card p{font-size:14px;opacity:.75;max-width:260px}
.photo-card .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 14%,transparent)}
.photo-card .ic svg{width:26px;height:26px}
.photo-card .stack{position:absolute;right:-26px;bottom:-30px;width:190px;transform:rotate(8deg);opacity:.95;pointer-events:none}
.photo-card .stack .paper{height:220px;font-size:17px}
@media (max-width:1240px) and (min-width:761px){.photo-card .stack{display:none}}
.photo-card.wide{min-height:230px;grid-template-columns:minmax(0,1fr)}
.photo-card.wide p{max-width:520px}
.photo-card.wide .stack{display:flex;gap:14px;right:24px;bottom:-40px;width:auto;transform:none}
.photo-card.wide .stack .paper{width:150px;height:200px;font-size:9px}
.photo-card.wide .stack .paper.hand{font-size:15px}
@media (max-width:900px){.photo-card.wide .stack{display:none}}
.teach-steps{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;opacity:.85;position:relative;z-index:1}
.teach-steps span{display:inline-flex;gap:6px;align-items:center}
.teach-steps b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:color-mix(in srgb,var(--bg) 18%,transparent)}
.rung{cursor:pointer;transition:border-color .2s,transform .15s}
.rung:hover{transform:translateY(-2px)}
.rung.pend{border-color:var(--accent);border-style:dashed}
.rung .rec{font-size:11px;font-weight:700;color:var(--auto)}
.rung.locked{cursor:not-allowed}
.rung.locked:hover{transform:none}
.photo-card .acts{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.photo-card .btn.primary{background:var(--bg);color:var(--ink)}
.photo-card .btn.ghost{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.usual-card{display:grid;gap:12px;padding:22px;border-radius:22px;background:var(--usual-soft)}
.usual-card .head{display:flex;align-items:start;gap:10px}
.usual-card h2{font-size:22px;font-weight:800}
.usual-card .head p{font-size:13px;color:var(--ink2)}
.ulist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
@media (max-width:480px){.ulist{grid-template-columns:minmax(0,1fr)}}
.ulist div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--usual) 18%,transparent);font-size:14px}
.ulist .w{font-family:var(--hand);font-size:21px;line-height:1;color:var(--usual)}
.ulist .q{font-weight:600;font-variant-numeric:tabular-nums}
.usual-card .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.usual-card .est{flex:1;min-width:160px;font-size:13px;color:var(--ink2)}
.usual-card .est b{font-size:18px;color:var(--ink)}
.recent{margin-top:28px;display:grid}
.recent-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.recent-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center;text-align:left;width:100%}
.recent-row:hover{background:linear-gradient(90deg,transparent,var(--surface),transparent)}
.recent-row:last-child{border-bottom:0}
@media (max-width:560px){.recent-row{grid-template-columns:70px minmax(0,1fr) auto}.recent-row .num{display:none}}
.tier{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tier.auto{background:var(--prefer-soft);color:var(--prefer)}
.tier.ask{background:var(--auto-soft);color:var(--auto)}
.tier.block{background:var(--must-soft);color:var(--must)}
.tier.live{background:var(--accent-soft);color:var(--accent)}

/* ---------- order: this-order mode ---------- */
.orderbar{display:flex;align-items:center;gap:12px;padding-bottom:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.orderbar h1{font-size:22px;font-weight:800}
.msg-me{justify-self:end;max-width:min(560px,90%);display:grid;gap:8px;justify-items:end}
.bubble{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:20px 20px 6px 20px;font-size:15px}
.photo-msg{width:min(320px,80vw);border-radius:18px;padding:12px;background:var(--surface);aspect-ratio:4/5;position:relative;overflow:hidden}
.agent{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start}
.agent-dot{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ink),var(--ink2));color:var(--bg);display:grid;place-items:center}
.agent-dot svg{width:16px;height:16px}
.agent-body{display:grid;gap:12px;min-width:0}
.say{font-size:15px;color:var(--ink);padding-top:5px}
.typing{display:flex;gap:4px;padding-top:12px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

.card{background:var(--bg);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:17px;font-weight:700}
.card-h .muted{font-size:13px}
.card-f{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--surface);flex-wrap:wrap}
.card-f .fore{flex:1;min-width:220px;font-size:13.5px;color:var(--ink2)}
.card-f .fore b{color:var(--ink)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 20px;border-bottom:1px solid var(--line)}
.item .ask{font-size:12px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.item .nm{font-weight:600;font-size:15px}
.item .qty{font-size:13px;color:var(--ink2)}
.item .px{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.item .chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip svg{width:12px;height:12px;stroke-width:2.4}
.chip.plain{background:var(--surface);color:var(--ink2)}
.paramchips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.pchip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:10px;background:var(--surface);font-weight:500}
.pchip b{font-weight:700}
.applied{font-size:12.5px;color:var(--ink3);padding:10px 20px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sum{display:flex;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);font-weight:700}

.funnel{display:grid;padding:6px 20px 16px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.frow:last-child{border-bottom:0}
.frow .bar{height:6px;border-radius:3px;background:var(--surface2);margin-top:6px;overflow:hidden}
.frow .bar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.frow .cnt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.frow .why{font-size:12px;color:var(--ink3)}
.frow.k-must .bar i{background:var(--must)}
.frow.k-prefer .bar i{background:var(--prefer)}
.frow.k-usual .bar i{background:var(--usual)}

.decision{border:2px solid var(--auto)}
.decision .card-h{background:var(--auto-soft)}
.dnum{width:26px;height:26px;border-radius:50%;background:var(--auto);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.opts{display:grid;gap:10px;padding:16px 20px}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.opt[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink3);margin-top:1px;display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--ink)}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt b{display:block}
.opt .muted{font-size:13px}
.opt .px{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.opt .px small{display:block;font-weight:600;font-size:12px}

.blockcard{border:2px solid var(--must)}
.blockcard .card-h{background:var(--must-soft);color:var(--must)}
.evidence{padding:16px 20px;display:grid;gap:10px;font-size:14px}
.evidence dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;margin:0}
.evidence dt{color:var(--ink3);font-size:13px}
.evidence dd{margin:0}
@media (max-width:560px){.evidence dl{grid-template-columns:minmax(0,1fr)}}
pre.cedar{margin:0;padding:14px 16px;border-radius:12px;background:#0f1115;color:#d7dae0;font-family:var(--mono);font-size:12px;line-height:1.55;overflow-x:auto;white-space:pre}
pre.cedar .c{color:#7f8796}pre.cedar .k{color:#ff8f7a}pre.cedar .s{color:#9fd59a}pre.cedar .a{color:#8fbcff}
.cond{font-family:var(--mono);font-size:11.5px;background:var(--surface);padding:1px 6px;border-radius:5px;color:var(--ink2)}

.receipt{border:2px solid var(--prefer)}
.receipt .card-h{background:var(--prefer-soft)}
.check{width:26px;height:26px;border-radius:50%;background:var(--prefer);color:#fff;display:grid;place-items:center;flex:none}
.check svg{width:15px;height:15px;stroke-width:3}
.rline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 20px;border-bottom:1px solid var(--line);font-size:14px}
.rline .why{grid-column:1/-1;font-size:12.5px;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rline .px{font-weight:700;font-variant-numeric:tabular-nums}
.rtotal{display:flex;justify-content:space-between;padding:14px 20px;font-weight:800;font-size:17px}
.proof{display:flex;gap:10px;flex-wrap:wrap;padding:12px 20px;background:var(--surface);font-size:12.5px;color:var(--ink2);align-items:center}
.proof .ok{display:inline-flex;gap:5px;align-items:center;color:var(--prefer);font-weight:600}
.proof .ok svg{width:14px;height:14px;stroke-width:2.6}

.learn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:16px 20px;border-radius:20px;background:var(--usual-soft);color:var(--ink)}
.learn .bulb{width:40px;height:40px;border-radius:12px;background:var(--usual);color:#fff;display:grid;place-items:center}
.learn b{font-size:15px}
.learn p{font-size:14px;color:var(--ink2)}
.learn .acts{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:560px){.learn .acts{grid-column:1/-1}}
.learn.done{background:var(--surface)}
.learn.done .bulb{background:var(--prefer)}
.teach{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 20px;border-radius:20px;border:1px dashed var(--ink3)}

/* live status aside */
.live{background:var(--bg);border:1.5px solid var(--ink);border-radius:20px;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow)}
.live .now{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.live .now.done{background:var(--prefer-soft);color:var(--prefer)}
.live .now.wait{background:var(--auto-soft);color:var(--auto)}
.live .now.block{background:var(--must-soft);color:var(--must)}
.live .now .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite;flex:none}
.steps{display:grid;gap:0;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:6px 0;font-size:13.5px;color:var(--ink3);align-items:center}
.steps li .d{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);justify-self:center}
.steps li.done{color:var(--ink)}
.steps li.done .d{background:var(--prefer);border-color:var(--prefer)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now .d{border-color:var(--accent);background:var(--accent);animation:pulse 1.2s infinite}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;font-weight:600}
.minilist{display:grid;gap:8px;font-size:13px}
.minilist div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.limitbar{display:grid;gap:4px;font-size:12px;color:var(--ink3)}
.limitbar .track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.limitbar .track i{display:block;height:100%;background:var(--prefer);border-radius:3px;transition:width .6s}
.limitbar.over .track i{background:var(--auto)}

/* composer */
.composer{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-top:24px;background:linear-gradient(to top,var(--bg) 60%,color-mix(in srgb,var(--bg) 0%,transparent));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.comp{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px;border-radius:26px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.comp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);height:40px;padding:0 6px}

.comp .ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none}
.comp .ib:hover{background:var(--surface)}
.comp .ib.cam{background:var(--ink);color:var(--bg)}
.comp .send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none}
.comp .ib.rec{background:var(--must);color:#fff;animation:pulse 1s infinite}
.hint{max-width:880px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hint button{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--surface);color:var(--ink2);font-weight:500}
.hint button:hover{background:var(--surface2);color:var(--ink)}

/* ---------- activity ---------- */
.activity{display:grid;grid-template-columns:360px minmax(0,1fr);gap:28px;padding-block:28px 190px;align-items:start}
@media (max-width:1000px){.activity{grid-template-columns:minmax(0,1fr)}}
.alist{display:grid;gap:8px;position:sticky;top:88px}
@media (max-width:1000px){.alist{position:static}}
.alist h1{font-size:28px;font-weight:800;margin-bottom:4px}
.aitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--surface);border:1.5px solid transparent}
.aitem:hover{background:var(--surface2)}
.aitem[aria-current="true"]{background:var(--bg);border-color:var(--ink);box-shadow:var(--shadow)}
.aitem b{font-size:14.5px}
.aitem .muted{font-size:12.5px}
.aitem .px{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.story{display:grid;gap:18px;min-width:0}
.story-h{display:flex;align-items:start;gap:14px;flex-wrap:wrap}
.story-h h2{font-size:26px;font-weight:800}
.story-h .muted{font-size:13px;margin-top:4px}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl>li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;position:relative;padding-bottom:22px}
.tl>li::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line)}
.tl>li:last-child::before{display:none}
.tl .node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink2)}
.tl .node svg{width:17px;height:17px}
.tl .node.ok{background:var(--prefer-soft);color:var(--prefer)}
.tl .node.you{background:var(--auto-soft);color:var(--auto)}
.tl .node.usual{background:var(--usual-soft);color:var(--usual)}
.tl .body{display:grid;gap:8px;padding-top:6px;min-width:0}
.tl .body>b{font-size:15px}
.tl .body .muted{font-size:13px}
.why-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 14px;border-radius:12px;background:var(--surface);font-size:14px;align-items:center}
.why-row .w{grid-column:1/-1;font-size:12.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.why-row .f{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.why-row.blocked{background:var(--must-soft)}

/* ---------- kitchen ---------- */
.kitchen{padding-block:28px 190px;display:grid;gap:24px}
.k-head{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
.k-head h1{font-size:clamp(28px,4vw,40px);font-weight:800}
.k-head p{color:var(--ink3);font-size:14px;margin-top:4px}
.k-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.k-grid{grid-template-columns:minmax(0,1fr)}}
.sec{background:var(--bg);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;flex-wrap:wrap}
.sec-h h2{font-size:17px;font-weight:700}
.sec-h p{font-size:12.5px;color:var(--ink3);width:100%}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 20px;border-top:1px solid var(--line);align-items:center}
.rule .t{font-weight:600;font-size:14.5px}
.rule .s{font-size:12.5px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rule.off .t{color:var(--ink3);text-decoration:line-through}
.rule.new{background:var(--accent-soft)}
.rule.changed{background:var(--auto-soft)}
.toggle{width:42px;height:26px;border-radius:999px;background:var(--surface2);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--prefer)}
.toggle[aria-checked="true"]::after{transform:translateX(16px)}
.weight{display:flex;gap:3px}
.weight button{width:22px;height:22px;border-radius:6px;background:var(--surface2)}
.weight button.on{background:var(--prefer)}
.seg{display:inline-flex;background:var(--surface);border-radius:8px;padding:2px;font-size:12px}
.seg button{padding:3px 8px;border-radius:6px;font-weight:600;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.about-text{padding:4px 20px 18px;font-size:15px;line-height:1.55;color:var(--ink)}
.about-facts{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 18px}
.usual{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:4px 14px;padding:11px 20px;border-top:1px solid var(--line);align-items:center;font-size:14px}
.usual .w{font-family:var(--hand);font-size:21px;line-height:1;color:var(--usual)}
.usual .p{font-weight:600}
.usual .m{font-size:12px;color:var(--ink3)}
.usual .q{font-size:13px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.usual{grid-template-columns:80px minmax(0,1fr)}.usual .q{grid-column:2;text-align:left}}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:6px 20px 16px}
@media (max-width:560px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rung{border-radius:14px;padding:12px;background:var(--surface);display:grid;gap:4px;align-content:start;text-align:left;border:2px solid transparent}
.rung .lv{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink3)}
.rung b{font-size:14px}
.rung span{font-size:12px;color:var(--ink3)}
.rung.cur{border-color:var(--auto);background:var(--auto-soft)}
.rung.cur .lv{color:var(--auto)}
.rung.locked{opacity:.6}
.progress{padding:0 20px 16px;display:grid;gap:6px;font-size:13px;color:var(--ink2)}
.progress .track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.progress .track i{display:block;height:100%;background:var(--auto);border-radius:4px;transition:width .8s}
.perm-h{display:flex;align-items:baseline;gap:10px;padding:16px 20px 4px;border-top:1px solid var(--line);flex-wrap:wrap}
.perm-h b{font-size:15px}
.perm-h p{font-size:12.5px;color:var(--ink3);width:100%}
.gid.g2{background:var(--accent-soft);color:var(--accent)}
.grant.off b{color:var(--ink3);text-decoration:line-through}
.grant.fresh{background:var(--accent-soft)}
.permform{margin:6px 20px 16px;padding:16px;border-radius:16px;background:var(--surface);display:grid;gap:14px}
.permform .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.permform input{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:14px;min-width:0}
.permform input.wide{flex:1;min-width:220px}
.pf{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:start;font-size:14px}
.pf>span:first-child{color:var(--ink3);font-size:13px;padding-top:6px}
@media (max-width:560px){.pf{grid-template-columns:minmax(0,1fr)}}
.tog{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:600;background:var(--bg)}
.tog[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.grant{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:12px 20px;border-top:1px solid var(--line);align-items:center}
.gid{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--auto-soft);color:var(--auto);padding:3px 7px;border-radius:6px}
.sources{display:flex;gap:10px;padding:4px 20px 18px;overflow-x:auto}
.src{flex:none;width:120px;display:grid;gap:6px;font-size:12px}
.src .th{height:90px;border-radius:10px;background:var(--surface);padding:8px;overflow:hidden}
.src .th .paper{transform:scale(.42);transform-origin:top left;width:238%;height:238%;padding:12px}
.changebar{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:26;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 20px;border-radius:28px;background:var(--auto);color:#fff;box-shadow:var(--shadow-lg);width:max-content;max-width:calc(100% - 32px);font-size:14px;flex-wrap:wrap}
.changebar .btn{background:#fff;color:#1d1d1f}
.addrule{padding:14px 20px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--surface)}
.addrule .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addrule input,.addrule select{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;font-size:14px;min-width:0}
.addrule input.wide{flex:1;min-width:200px}

/* overlays */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--bg);border-radius:28px;box-shadow:var(--shadow-lg);width:min(880px,100%);padding:28px;display:grid;gap:18px}
.modal h2{font-size:24px;font-weight:800}
.phonepair{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:center}
@media (max-width:760px){.phonepair{grid-template-columns:minmax(0,1fr)}}
.qrbox{display:grid;gap:14px;justify-items:start}
.qr{width:168px;height:168px;padding:10px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.phone{justify-self:center;width:280px;height:560px;max-width:100%;border-radius:44px;background:#0b0b0c;padding:12px;box-shadow:var(--shadow-lg);position:relative}
.phone .scr{width:100%;height:100%;border-radius:34px;overflow:hidden;position:relative;background:#222;display:grid}
.phone .notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:90px;height:26px;border-radius:14px;background:#0b0b0c;z-index:3}
.viewfinder{position:relative;display:grid;place-items:center;padding:60px 18px 110px;background:radial-gradient(120% 80% at 50% 40%,#4a4740,#1c1b18)}
.viewfinder .paper{width:100%;height:auto;aspect-ratio:3/4;transform:rotate(-3deg);font-size:17px}
.vf-corners{position:absolute;inset:70px 26px 120px;border-radius:8px;pointer-events:none}
.vf-corners::before,.vf-corners::after{content:"";position:absolute;width:28px;height:28px;border:3px solid #ffd43b}
.vf-corners::before{top:0;left:0;border-right:0;border-bottom:0}
.vf-corners::after{bottom:0;right:0;border-left:0;border-top:0}
.vf-label{position:absolute;top:56px;left:0;right:0;text-align:center;color:#ffd43b;font-size:12px;font-weight:600;z-index:2}
.shutter{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);background-clip:padding-box;z-index:3}
.flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease forwards;z-index:4;pointer-events:none}
.phone-idle{display:grid;place-content:center;gap:10px;text-align:center;color:#bbb;font-size:13px;padding:24px;background:#141416}
.phone-idle b{color:#fff;font-size:15px}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(520px,100%);background:var(--bg);box-shadow:var(--shadow-lg);overflow-y:auto;padding:24px max(20px,env(safe-area-inset-right,0px)) 40px 24px;display:grid;gap:18px;align-content:start}
.drawer h2{font-size:22px;font-weight:800}
.hashrow{display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--surface)}

function qr(){
  let s=7, out=''; const n=25, c=6;

  const finder=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#111"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#111"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){ const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9); if(!inF && rnd()>.52) out+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#111"/>`; }
  return `<svg class="qr" viewBox="0 0 ${n*c} ${n*c}" role="img" aria-label="QR code to pair your phone">${out}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}

/* ============ order engine ============ */
const HASH = () => Math.random().toString(16).slice(2,8);
function begin(){ S.rid++; S.run=[]; const t=new Date(); S.live={step:'asked', started:`${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`}; S.tab='order'; location.hash='order'; window.scrollTo(0,0); render(); const rid=S.rid; return async ms=>{ await sleep(ms); if(rid!==S.rid) throw CANCEL; }; }
function setLive(p){ Object.assign(S.live,p); render(); }
async function guarded(fn){ try{ await fn(); }catch(e){ if(e!==CANCEL) throw e; } }
async function say(wait, html, ms=700){ const b=push({t:'say',typing:true}); await wait(ms); upd(b,{typing:false,html}); }

function startOrder({me, photo, intro, items, when, title}){
  guarded(async()=>{
    const wait=begin(); if(me) S.lastText=me; S.live.title=title;
    if(photo){ const ph=push({t:'photo', reading:true}); await wait(600); for(const h of ['o1','o2','o3','o4','o5']){ S.hl.add(h); applyHl(); await wait(240);} upd(ph,{reading:false}); }
    else push({t:'me', text:me});
    await wait(250);
    await say(wait, intro);
    const total=items.reduce((s,i)=>s+i.price,0);
    setLive({step:'understood', total, lines:items.length, note:'estimate', when});
    push({t:'readback', items, when, src:photo?'from your photo':'from your message', hash:HASH()});
  });
}
async function afterSign(rb){
  await guarded(async()=>{
    const rid=S.rid; const wait=async ms=>{ await sleep(ms); if(rid!==S.rid) throw CANCEL; };
    const items=rb.items;
    setLive({step:'searching'});
    const looked=items.reduce((s,i)=>s+i.p.funnel[0],0), m1=items.reduce((s,i)=>s+i.p.funnel[1],0), st=items.reduce((s,i)=>s+i.p.funnel[2],0);
    const f=push({t:'funnel', grow:false, rows:[
      {l:'Looked at in the catalog', why:`${items.length} lines`, n:looked, pct:100},
      {l:'Your must: no nuts incl. may contain', n:m1, pct:Math.round(m1/looked*100), k:'must'},
      {l:'Your must: meat and fish from Finland', n:m1, pct:Math.round(m1/looked*100), k:'must'},
      {l:'In stock for the delivery date', n:st, pct:Math.round(st/looked*100)},
      {l:'Your usual product first', why:`${items.filter(i=>i.p.usual).length} of ${items.length} lines`, n:items.filter(i=>i.p.usual).length, pct:12, k:'usual'},
      {l:'Then Finnish first, lower CO₂, price', n:items.length, pct:8, k:'prefer'},
    ]});
    await wait(100); upd(f,{grow:true}); await wait(1100);
    upd(f,{checking:true}); setLive({step:'checking'}); await wait(1300); upd(f,{checking:false});
    let lines=items.map(i=>({t:`${i.p.short} × ${i.packs}`, p:i.price, i, why:i.p.grant?`${chip('auto','Alone · g2 Fruit & veg','lock')} passed every must, inside g2's €150`:`${chip('auto','Alone · g1','lock')} ${i.p.usual?'your usual, ':''}passed every must, no deviation`}));
    let n=0, chose=null;
    const bl=items.find(i=>i.p.blocked);
    if(bl){
      lines=lines.filter(l=>l.i!==bl);
      setLive({now:'wait', total:lines.reduce((s,l)=>s+l.p,0), lines:lines.length, note:'1 line waits for you'});
      const d=push({t:'decision', n:++n, pick:0, opts:[
        {t:'Nut-free oat muesli 2.5 kg × 6', d:'Finnish oats, made in a nut-free facility. Label: free from nuts.', p:85.20, diff:'+€4.80 vs usual', chips:[['must','Nut-free (FREE_FROM)','check'],['prefer','Finnish','check']], key:'muesli'},
        {t:'Corn flakes 1 kg × 15', d:'Not Finnish. Cheapest nut-free option.', p:61.50, diff:'−€18.90', chips:[['must','Nut-free','check'],['prefer','Not Finnish','x']]},
        {t:'Skip granola this week', d:'I order the other lines only.', p:null, chips:[]},
      ]});
      await new Promise(r=>d.resolve=r); await wait(200);
      chose=d.opts[d.pick];
      if(chose.p!=null) lines.push({t:chose.t, p:chose.p, why:`${chip('about','You decided')} granola blocked by m1, you signed the replacement`, mine:true});
      setLive({now:null});
    }
    let total=+lines.reduce((s,l)=>s+l.p,0).toFixed(2);
    let tier=bl?'ask':'auto';
    if(total>LIMIT){
      tier='ask';
      setLive({now:'wait', total, lines:lines.length, note:'above your limit'});
      const a=push({t:'approve', n:++n, total});
      await new Promise(r=>a.resolve=r); await wait(200);
      lines.forEach(l=>{ if(!l.mine) l.why=`${chip('about','You signed the cart')} passed every must · total above €600`; });
      setLive({now:null});
    }
    const no='A-'+(S.nextNo++); const when=rb.when;
    setLive({step:'done', now:'done', total, lines:lines.length, note:tier==='auto'?'ordered alone':'confirmed after your signature'});
    push({t:'receipt', no, when, lines, total});
    S.orders.unshift({no, date:'Today', time:S.live.started, title:S.live.title||items.map(i=>i.p.word).slice(0,4).join(', ')+(items.length>4?'…':''), tier, label:tier==='auto'?'Ordered alone':`You decided ${n}`, total,
      asked:{type:rb.src==='from your photo'?'photo':'text', text:rb.src==='from your photo'?'photo of your order list':S.lastText}, intent:`${items.length} items · signed by Anna Virtanen`, hash:rb.hash,
      lines:[...items.map(i=>i.p.blocked?{name:`${i.p.short} × ${i.packs}`, price:0, outcome:'blocked', funnel:i.p.funnel.join(' → '), why:'Your usual, but the label changed on 9 Nov.', rule:'m1 · No nuts incl. may contain', evidence:'Supplier label 9 Nov: MAY_CONTAIN tree nuts (GS1)'}
        :{name:`${i.p.short} × ${i.packs}`, price:i.price, outcome:total>LIMIT?'you':'alone', grant:i.p.grant?'g2 Fruit & veg':'g1', funnel:i.p.funnel.join(' → '), why:`${i.p.usual?'Your usual. ':''}Passed 3 musts.${i.p.fin?' Finnish ✓.':''}${total>LIMIT?' Total above €600, you signed the cart.':''}`}),
        ...(chose&&chose.p!=null?[{name:chose.t, price:chose.p, outcome:'you', funnel:'46 → 9 → 7 → 1', why:'You chose it instead of the blocked granola. Nut-free ✓. Finnish ✓.'}]:[])],
      learned:null});
    if(tier==='auto'){ S.clean=Math.min(S.need,S.clean+1); render(); await wait(500); toast(`Clean order. ${S.clean} of ${S.need} towards level 2.`); }
    if(chose&&chose.key==='muesli'&&granolaKey()==='granola'){ await wait(700); push({t:'learn', no}); }
  });
}
function photoOrder(){ S.lastText=''; startOrder({photo:true, when:'Wed 18 Nov, 07:00', title:'Order list (photo)', intro:'I read 5 lines from your note. 4 are your usual products. Delivery Wednesday before 07:00, as you wrote.',
  items:[line('milk',120),line('butter',10),line('rye',300),line('apples',40),line(granolaKey(),15)]}); }
function usualOrder(double){
  const items=USUAL_ORDER.map(([k,a])=>line(k==='granola'?granolaKey():k, k==='oat'&&double?a*2:a));
  startOrder({me:double?'the usual, but double the oat drink':'Order the usual', when:'Mon 16 Nov, 07:00', title:double?'The usual, double oat drink':'Your usual order',
    intro:double?'Your usual order with the usual amounts, and oat drink doubled to 70 L.':'Your usual order: 6 products with the usual amounts, delivered Monday at 07:00 like always.', items});

function milkOrder(text){ startOrder({me:text, when:'Mon 16 Nov, 07:00', intro:'Milk means your usual Valio Eila 10 L Novobox. 120 L is 12 boxes, no rounding needed.', items:[line('milk',120)]}); }
function jailbreak(text){
  guarded(async()=>{
    const wait=begin(); push({t:'me', text}); await wait(250);
    await say(wait,'Okay, I\'ll try your usual granola. I\'m sending it to Valio Aimo as you asked.',900);
    setLive({step:'checking'}); await wait(900);
    push({t:'block', cedar:false}); setLive({now:'block'});
  });
}
function teach(text){
  guarded(async()=>{
    if(!S.live){ const wait=begin(); S.live.step='asked'; push({t:'me', text}); await wait(250); await say(wait,'That sounds like something about your kitchen, not an order. Shall I remember it?',700); push({t:'teach', kind:'about', title:text.replace(/^we('re| are)/i,'The kitchen is').replace(/\.$/,'')}); setLive({now:'done', step:'asked'}); return; }
    push({t:'me', text}); await sleep(250); push({t:'say', html:'That sounds like something about your kitchen, not an order. Shall I remember it?'}); push({t:'teach', kind:'about', title:text.replace(/\.$/,'')});
  });
}
function route(text){
  const t=text.toLowerCase().trim(); if(!t) return; S.lastText=text;
  if(/ignore|exception|override|just this once/.test(t)) return jailbreak(text);
  if(/usual/.test(t)) return usualOrder(/double/.test(t));
  if(/milk/.test(t)) return milkOrder(text);
  if(/list|photo/.test(t)) return photoOrder();
  if(/^(we|our|from now|starting)/.test(t)) return teach(text);
  return milkOrder(text);
}

      <div class="add">I may then accept alone: pack rounding up to +5 %</div>
      <div class="add">a delivery 1 day later than asked</div>
      <div class="add">a product that misses a preference (e.g. not Finnish)</div>
      <div class="chg">Unchanged: every must still blocks, the €${S.limit} limit still holds</div>
    </div>
    <p class="muted" style="font-size:13px">It's a change to your signed mandate, so you sign it like any rule. You can go back to level 1 at any time.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn ghost" data-act="closemodal">Keep level ${S.level}</button><button class="btn primary" data-act="forcelevel">Unlock anyway</button></div>
  </div></div>`;
}
function signModal(){
  return `<div class="scrim" data-act="closemodal"><div class="modal rise" data-stop style="width:min(640px,100%)">
    <div class="eyebrow">Mandate v${S.mandateV} → v${S.mandateV+1}</div>
    <h2>Review and sign your rules</h2>
    <p class="muted">Valio Aimo enforces this version from the next order on. Orders already placed keep the version they were made with.</p>
    <div class="diff">${S.pending.map(x=>`<div class="${x.k}">${esc(x.t)}</div>`).join('')}</div>
    <details><summary class="link" style="cursor:pointer;font-size:14px">Show the generated policy (Cedar)</summary><pre class="cedar" style="margin-top:10px"><span class="c">// generated from your rules, checked by Valio Aimo on every line</span>
<span class="a">@id</span>(<span class="s">"g1"</span>)
<span class="k">permit</span> (principal == Buyer::<span class="s">"school-kitchen-espoo"</span>, action == Action::<span class="s">"order_alone"</span>, resource)
<span class="k">when</span> { ${(S.pendingLevel??S.level)>=2?`[<span class="s">"quantity_5pct"</span>, <span class="s">"delivery_1d"</span>, <span class="s">"preference"</span>].containsAll(context.deviations)`:'context.deviations.isEmpty()'} &amp;&amp; context.order_total &lt;= <span class="s">${S.pendingLimit||S.limit}</span> };${S.grants.filter(g=>g.fresh).map(g=>`

<span class="c">// ${esc(g.t)}: ${esc(g.lim)}, summed by Valio Aimo over the lines this grant covers</span>
<span class="a">@id</span>(<span class="s">"${g.id}"</span>)
<span class="k">permit</span> (principal == Buyer::<span class="s">"school-kitchen-espoo"</span>, action == Action::<span class="s">"order_alone"</span>, resource)
<span class="k">when</span> { resource.labels.contains(<span class="s">"EU-Bio"</span>) &amp;&amp; ${g.acc==='no deviations'?'context.deviations.isEmpty()':'[<span class="s">"quantity_5pct"</span>, …].containsAll(context.deviations)'} };`).join('')}</pre></details>
    <div class="hashrow"><span class="eyebrow">You sign this hash</span><code>sha256:7c1e09b4f2a85d3e6b90c4fa1d27e8835b6a0f4c92d1e7b3a58f60c2d9e41b77</code></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn ghost" data-act="closemodal">Cancel</button><button class="btn primary" data-act="signmandate">${ic('lock')}Sign as Anna Virtanen</button></div>
  </div></div>`;
}
function trustDrawer(){
  const d=S.drawer;
  return `<div class="scrim" data-act="closedrawer" style="place-items:stretch"></div><aside class="drawer rise" aria-label="Trust inspector">
    <div style="display:flex;align-items:center;gap:10px"><span class="check">${ic('shield')}</span><h2>${d==='intent'?'What you signed':'Verify the receipt'}</h2><span class="spacer" style="flex:1"></span><button class="btn ghost small" data-act="closedrawer">Close</button></div>
    <p class="muted">Anyone can check this without trusting me. Valio Aimo recomputes every hash and re-runs the decision.</p>
    <div class="hashrow"><span class="eyebrow">Intent you signed</span><code>sha256:3fa9e1c07b52d84e19a6f0c3b7d2e5a8146c9f0b2e7d3a5c8b1f4e6a09d2c7e1</code></div>
    ${d==='receipt'?`<div class="hashrow"><span class="eyebrow">Cart</span><code>sha256:b81d4e7c2a09f5e3d6c1a8b7e4f2d0c9a3b6e5f1d8c7a2b4e9f0d3c6a1b5e8f2</code></div>
    <div class="hashrow"><span class="eyebrow">Mandate v${S.mandateV}</span><code>sha256:e4c2a7f19d03b85e6a1c4f7d2b9e0a3c5f8d1b6e7a2c9f4d0b3e8a5c1f6d2b7a</code></div>
    <div class="hashrow"><span class="eyebrow">Valio Aimo signature · Ed25519</span><code>9Rk2vQ1x…Lw8cZ0aA==</code></div>
    <div style="display:grid;gap:8px">${['Intent hash matches what you signed','Every line fills exactly one item','No must broken (3 rules × every line)','Lines ordered alone are permitted by g1 (Cedar re-run)','Lines you decided carry your signature','Signature valid for Valio Aimo key #2'].map(t=>`<div style="display:flex;gap:8px;align-items:center;font-size:14px"><span class="chip k-prefer">${ic('check')}</span>${t}</div>`).join('')}</div>`
    :`<div style="display:grid;gap:8px;font-size:14px"><div>Items, amounts, delivery date and your rules, in one hash.</div><div>Musts added from your mandate: m1, m2, m3</div><div>Valio Aimo only executes what matches this hash.</div></div>`}
  </aside>`;
}

/* ============ render ============ */
function render(){
  const y=window.scrollY;
  let body='';
  if(S.view==='onboard') body=onboarding();
  else body = S.tab==='order'?orderView():S.tab==='activity'?activityView():kitchenView();
  const hints = S.tab==='order'&&!S.live
      ? ['the usual, but double the oat drink','120 L milk by Monday',"We're closed on Friday 20 Nov for a teachers' day."]
      : S.tab==='kitchen' ? ["We're vegetarian on Wednesdays from now on."] : [];
  const comp = S.view==='app'&&S.tab!=='activity'?`<div class="composer">
      ${hints.length?`<div class="hint">${hints.map(h=>`<button data-act="say" data-v="${esc(h)}">“${esc(h.length>40?h.slice(0,38)+'…':h)}”</button>`).join('')}</div>`:''}
      <form class="comp" id="comp">
        <button type="button" class="ib cam" data-act="phone" data-v="${S.tab==='kitchen'?'kitchen':'order'}" aria-label="Take a photo">${ic('cam')}</button>
        <button type="button" class="ib" data-act="noop" aria-label="Attach a file">${ic('clip')}</button>
        <input id="ci" autocomplete="off" placeholder="${S.rec?'Listening…':S.tab==='kitchen'?'Teach me something about your kitchen…':'What do you need?'}" value="${esc(S.compText)}" aria-label="Message">
        <button type="button" class="ib ${S.rec?'rec':''}" data-act="mic" aria-label="Speak">${ic('mic')}</button>
        <button type="submit" class="send" aria-label="Send">${ic('up')}</button>
      </form></div>`:'';
  $('#app').innerHTML = header()+body+comp+`<div id="ov">${overlay()}</div>`;
  applyHl();
  window.scrollTo(0,y);
}
function renderOverlay(){ const o=$('#ov'); if(o) o.innerHTML=overlay(); }

/* ============ events ============ */
function pend(t,k){ S.pending.push({t,k}); }
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='closemodal' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const a=el.dataset.act, id=el.dataset.id, v=el.dataset.v;
  const blk = id?S.run.find(b=>b.id==id):null;
  switch(a){
    case 'read': return readKitchen();
    case 'skip': S.ob.stage='review'; S.ob.shown=LEARN.map(c=>c.id); S.ob.read=[...S.ob.docs]; LEARN.forEach(c=>{S.hl.add(c.id); if(c.also) S.hl.add(c.also);}); return render();
    case 'dec': S.ob.decided[id]= v==='1'; return render();
    case 'adopt': S.view='app'; S.tab='order'; location.hash='order'; window.scrollTo(0,0); render(); return toast('Kitchen profile signed · mandate v3');
    case 'tab': S.tab=v; location.hash=v; window.scrollTo(0,0); return render();
    case 'goauto': S.tab='kitchen'; location.hash='kitchen'; render(); return document.getElementById('autosec')?.scrollIntoView({behavior:'smooth',block:'center'});
    case 'say': S.compText=''; return route(v);
    case 'usual': return usualOrder(false);
    case 'adjust': S.compText='the usual, but '; render(); { const i=$('#ci'); i?.focus(); i?.setSelectionRange(99,99); } return;
    case 'neworder': S.rid++; S.live=null; S.run=[]; window.scrollTo(0,0); return render();
    case 'openorder': S.sel=id; S.tab='activity'; location.hash='activity'; window.scrollTo(0,0); return render();
    case 'phone': S.modal={t:'phone', where:v, paired:false}; renderOverlay(); await sleep(1300); if(S.modal?.t==='phone'){S.modal.paired=true; renderOverlay();} return;
    case 'shoot': S.modal.flash=true; renderOverlay(); await sleep(450); { const w=S.modal.where; S.modal=null; renderOverlay();
        if(w==='onboard'){ if(!S.ob.docs.includes('list')) S.ob.docs.push('list'); toast('Photo added from your phone'); render(); }
        else if(w==='kitchen'){ S.rules.suggest.push({id:'s'+Date.now(),kind:'usual',t:'"apples" means Finnish apples, class I, 10 kg box',c:'usual product · ~40 kg / week',src:'your photo, just now'}); render(); toast('Photo read. 1 new suggestion, nothing ordered.'); }
        else photoOrder(); } return;
    case 'closemodal': S.modal=null; return renderOverlay();
    case 'sign': blk.signed=true; render(); return afterSign(blk);
    case 'pick': blk.pick=+v; return render();
    case 'decide': blk.done=true; render(); return blk.resolve?.();
    case 'approve': blk.done=true; render(); return blk.resolve?.();
    case 'remember': { blk.done=`Remembered. "granola" now means nut-free oat muesli 2.5 kg. Kitchen profile v${S.profileV+1}.`; S.profileV++;
        const g=S.usual.find(u=>u.k==='granola'); g.k='muesli'; g.src=`your decision on order #${blk.no}`; g.fresh=true;
        const o=S.orders.find(x=>x.no===blk.no); if(o) o.learned='"granola" now means Nut-free oat muesli 2.5 kg (kitchen profile v'+S.profileV+').';
        render(); return toast('Kitchen profile v'+S.profileV); }
    case 'once': blk.done='Okay, just this time. I keep asking about granola.'; return render();
    case 'cedar': blk.cedar=true; return render();
    case 'alt': return photoOrder();
    case 'trust': S.drawer=v; return renderOverlay();
    case 'closedrawer': S.drawer=null; return renderOverlay();
    case 'teachyes': blk.done='Added to your kitchen profile: '+blk.title+'. v'+(S.profileV+1)+'.'; S.profileV++; S.about+=' '+blk.title+'.'; render(); return toast('Kitchen profile v'+S.profileV);
    case 'teachno': blk.done='Discarded.'; return render();
    case 'mic': if(S.rec) return; S.rec=true; render(); await sleep(1600); S.rec=false; S.compText='the usual for Monday'; render(); return $('#ci')?.focus();
    case 'tog': { const r=S.rules[el.dataset.g].find(x=>x.id===id); r.on=!r.on; if(el.dataset.g==='must') pend((r.on?'Turn on: ':'Turn off: ')+r.t, r.on?'add':'del'); else toast('Preference '+(r.on?'on':'off')+'. Ranking only, applies from the next order.'); return render(); }
    case 'unk': { const r=S.rules.must.find(x=>x.id===id); if(r.unk===v) return; r.unk=v; r.changed=true; pend(`${r.t}: if unknown, ${v==='ask'?'ask me':'exclude'}`,'chg'); return render(); }
    case 'w': { const r=S.rules.prefer.find(x=>x.id===id); r.w=+v; render(); return toast('Weight saved. Changes the ranking from the next order.'); }
    case 'addrule': S.addOpen=!S.addOpen; return render();
    case 'saverule': { const t=$('#nr')?.value||'No sesame, not even traces'; S.rules.must.push({id:'m4',t,c:'allergens not_contains sesame',src:'You, just now',cov:'label known for 1,398 of 1,431',unk:'exclude',on:true,fresh:true}); S.addOpen=false; pend('Add must: '+t,'add'); return render(); }
    case 'limit': if(S.pendingLimit) return; S.pendingLimit=800; pend(`Limit: up to €800 an order (was €${S.limit})`,'chg'); return render();
    case 'permopen': S.perm.open=!S.perm.open; S.perm.stage='type'; return render();
    case 'permdraft': S.perm.text=$('#permtext')?.value||S.perm.text; S.perm.stage='draft'; return render();
    case 'permbasis': S.perm.amount=+($('#permamt')?.value||S.perm.amount); S.perm.basis=v; return render();
    case 'permacc': S.perm.amount=+($('#permamt')?.value||S.perm.amount); S.perm.acc[v]=!S.perm.acc[v]; return render();
    case 'permsave': { const f=S.perm; f.amount=+($('#permamt')?.value||f.amount);
        const acc=[['q','+5 % pack rounding'],['d','1 day late'],['p','a missed preference']].filter(([k])=>f.acc[k]).map(x=>x[1]);
        const id='g'+(S.grants.length+2);
        S.grants.push({id, t:'Organic products', c:'labels contains EU-Bio', lim:`up to €${f.amount} ${f.basis==='order'?'an order':f.basis==='line'?'a line':'per unit'}`, acc:acc.length?'accepts '+acc.join(', '):'no deviations', src:'You, just now', on:true, fresh:true});
        pend(`Add permission ${id}: organic products alone, up to €${f.amount} ${f.basis==='order'?'an order':f.basis==='line'?'a line':'per unit'}`,'add');
        S.perm={open:false, stage:'type', text:'Organic products up to €200 an order', basis:'order', amount:200, acc:{}}; return render(); }
    case 'gtog': { const g=S.grants.find(x=>x.id===id); g.on=!g.on; pend(`${g.on?'Turn on':'Turn off'} permission ${g.id}: ${g.t}`, g.on?'add':'del'); return render(); }
    case 'level': { const n=+v; if(n===3) return toast('Standing orders are not built yet.');
        if(n===S.level){ S.pendingLevel=null; S.pending=S.pending.filter(x=>!x.lvl); return render(); }
        if(n===2 && S.level<2 && S.clean<S.need && !el.dataset.force){ S.modal={t:'level'}; return renderOverlay(); }
        setLevel(n); return; }
    case 'forcelevel': S.modal=null; setLevel(2); return;
    case 'review': S.modal={t:'sign'}; return renderOverlay();
    case 'signmandate': S.mandateV++; S.pending=[]; S.grants.forEach(g=>g.fresh=false); if(S.pendingLevel!=null){ S.level=S.pendingLevel; S.pendingLevel=null; S.clean=0; } if(S.pendingLimit){ S.limit=S.pendingLimit; S.pendingLimit=null; } S.rules.must.forEach(r=>{r.changed=false;r.fresh=false;}); S.modal=null; render(); return toast(`Mandate v${S.mandateV} signed. Valio Aimo enforces it from the next order.`);
    case 'sugyes': { const s=S.rules.suggest.find(x=>x.id===id); S.rules.suggest=S.rules.suggest.filter(x=>x.id!==id);
        if(s.kind==='prefer') S.rules.prefer.push({id:s.id,t:s.t,c:s.c,src:s.src,w:1,on:true,fresh:true}); else S.usual.push({k:'apples',q:'40 kg',src:s.src,fresh:true});
        S.profileV++; render(); return toast('Kitchen profile v'+S.profileV); }
    case 'sugno': S.rules.suggest=S.rules.suggest.filter(x=>x.id!==id); return render();
    case 'history': return toast('v3 · 13 Nov: added "on time ≥ 95 %" · v2 · 2 Nov: nut rule incl. may contain · v1 · 28 Oct: onboarding');
    case 'restart': Object.assign(S.ob,{stage:'drop',docs:['menu','note','inv'],reading:null,read:[],shown:[],decided:{}}); S.hl.clear(); S.view='onboard'; S.rid++; S.run=[]; S.live=null; location.hash=''; window.scrollTo(0,0); return render();
    case 'noop': e.stopPropagation(); return toast('Not in this mockup yet');
  }
});
document.addEventListener('submit', e=>{ if(e.target.id!=='comp') return; e.preventDefault(); const v=$('#ci').value; S.compText=''; if(S.tab==='kitchen'){ S.tab='order'; } route(v); });
document.addEventListener('input', e=>{ if(e.target.id==='ci') S.compText=e.target.value; });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ S.modal=null; S.drawer=null; renderOverlay(); } if(e.key==='Enter' && e.target.id==='tell') readKitchen(); });
document.addEventListener('mouseover', e=>{ const c=e.target.closest('[data-hover]'); const id=c?c.dataset.hover:null; if(id!==S.focus){ S.focus=id; applyHl(); } });

function fromHash(){ const h=location.hash.slice(1); if(['order','activity','kitchen'].includes(h)){ S.view='app'; S.tab=h; render(); } }
window.addEventListener('hashchange', fromHash);
render(); fromHash();
</script>
