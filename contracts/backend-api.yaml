openapi: 3.1.0
info:
  title: ValioValue Buyer Agent API
  version: 0.4.0
  description: |
    Contract between the frontend and the buyer-side backend.
    The frontend talks ONLY to this API. It never talks to the MCP server directly.

    Flow (v0.2, "what you see is what you sign"):
      1. POST /chat           -> returns session_id
      2. GET  /chat/{id}/stream (SSE) -> agent progress as typed events
      3. `intent_proposed`: the agent's reading of the request. The human checks the chips and
         confirms via POST /intents/{id}/confirm (signed). Nothing is searched or ordered before.
      4. The agent searches and orders against the confirmed intent. Valio Aimo diffs every
         quote against it and decides the tier: auto, ask or block.
      5. If an `approval_required` event arrives, the human decides via POST /approvals/{id},
         sending the cart_hash they were shown.
      6. GET /orders/{id}/audit -> human-readable decision log
         GET /orders/{id}/verify -> live check of hashes and signatures on the receipt

    Event payloads are defined in components/schemas/*Event and have example
    files in contracts/fixtures/events/.

    Kitchen agent (work packages 1a, 1b, 1c, 2b, see docs/work-packages/):
      * Photos and PDFs: POST /uploads, then POST /chat with attachments (order) or POST /kitchen/ingest
        (learn, never order). Phone as camera: POST /pairings, show phone_url as QR, listen on
        GET /pairings/{id}/stream for photo_received.
      * Kitchen profile: GET/PATCH /kitchen, suggestions with verbatim quotes, accept with the mandate
        signature round trip (409 needs_signature -> resend with mandate_hash).
      * Usual products: intent items carry product.preferred_product_id; offers carry `usual` and a funnel.
      * Orders and autonomy: GET /orders, GET /autonomy, POST /autonomy/level, POST /autonomy/sync-usual.
servers:
  - url: http://localhost:8000
    description: Local backend (or mock-backend for frontend dev)

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /chat:
    post:
      summary: Send a user message to the buyer agent
      description: Starts a new session, or continues one if session_id is given.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Accepted. Subscribe to the stream for the agent's work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }

  /chat/{session_id}/stream:
    get:
      summary: Server-sent events stream of the agent's progress
      description: |
        `text/event-stream`. Each SSE message has `event: <type>` and `data: <json>`.
        Types: user_message, reasoning, message, intent_proposed, intent_confirmed, tool_call, tool_result,
        offers, approval_required, order_confirmed, order_rejected, autonomy_progress, context_suggestion, error, done.
        Ignore unknown types.
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReasoningEvent"
                  - $ref: "#/components/schemas/MessageEvent"
                  - $ref: "#/components/schemas/ToolCallEvent"
                  - $ref: "#/components/schemas/ToolResultEvent"
                  - $ref: "#/components/schemas/OffersEvent"
                  - $ref: "#/components/schemas/ApprovalRequiredEvent"
                  - $ref: "#/components/schemas/OrderConfirmedEvent"
                  - $ref: "#/components/schemas/IntentProposedEvent"
                  - $ref: "#/components/schemas/IntentConfirmedEvent"
                  - $ref: "#/components/schemas/OrderRejectedEvent"
                  - $ref: "#/components/schemas/ErrorEvent"
                  - $ref: "#/components/schemas/DoneEvent"
                  - $ref: "#/components/schemas/UserMessageEvent"
                  - $ref: "#/components/schemas/AutonomyProgressEvent"
                  - $ref: "#/components/schemas/ContextSuggestionEvent"

  /tools:
    get:
      summary: MCP tools the agent can use, with documentation and input schema
      responses:
        "200":
          description: Tool list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    description: { type: string }
                    input_schema: { type: object }

  /approvals:
    get:
      summary: List approval requests
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        "200":
          description: Approval requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Approval" }

  /approvals/{approval_id}:
    post:
      summary: Approve or reject (human only, never exposed to the agent)
      parameters:
        - in: path
          name: approval_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }

  /orders/{order_id}/audit:
    get:
      summary: Human-readable audit trail for one order
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  /orders/{order_id}/story:
    get:
      summary: What happened to one order and why, in plain sentences (Activity tab, package 2c)
      description: >
        Built from the order, its intent and its audit trail. `why` sentences come from templates, never from an LLM,
        and contain no hashes, rule ids or grant ids. Steps: asked, understood, searched, decided, confirmed, learned
        (an accepted suggestion whose source is this order, 2a). Fixture: contracts/fixtures/order-story.json.
        `funnel` per searched item is catalog → after your musts → can deliver → picked (only recorded counts).
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The story
          content:
            application/json:
              schema:
                type: object
                required: [order_id, label, tier, steps]
                properties:
                  order_id: { type: string }
                  label: { type: string, example: "Ordered alone" }
                  tier: { type: string, enum: [auto, ask, block] }
                  total: { type: number }
                  mandate: { type: object, properties: { version: { type: integer }, grants_used: { type: array, items: { type: string } } } }
                  kitchen_profile_version: { type: integer, description: "Kitchen profile version the agent read when it proposed the intent. Only while the backend knows it." }
                  steps: { type: array, items: { type: object, required: [kind], properties: { kind: { type: string, enum: [asked, understood, searched, decided, confirmed, learned] }, at: { type: string } }, additionalProperties: true } }
        "404": { description: Unknown order }

  /mandate:
    get:
      summary: The buyer's current mandate (Must, Prefer, Autonomy) as Valio Aimo enforces it
      parameters:
        - { name: buyer_id, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Mandate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mandate" }
    put:
      summary: Store a new mandate version, signed with the buyer key. Applies to every order decided from now on.
      description: |
        Human only, never an MCP tool: the agent cannot change its own mandate. Send the mandate_hash from
        /mandate/preview that the human saw; if the mandate changed in between, 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MandateUpdate" }
      responses:
        "200": { description: The stored version, content: { application/json: { schema: { $ref: "#/components/schemas/Mandate" } } } }
        "409": { description: Shown hash no longer matches }
        "422": { description: Invalid mandate (unknown attribute, operator, limit ...) with a readable error }

  /mandate/preview:
    post:
      summary: Validate a new mandate. Returns the next version, its hash, a plain summary and the generated Cedar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MandateUpdate" }
      responses:
        "200": { description: Preview, content: { application/json: { schema: { $ref: "#/components/schemas/Mandate" } } } }
        "422": { description: Invalid mandate }

  /mandate/history:
    get:
      summary: All versions of the buyer's mandate, newest first
      parameters:
        - { name: buyer_id, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Versions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Mandate" } } } } }

  /mandate/cedar:
    get:
      summary: The mandate compiled to Cedar (musts as forbid, grants as permit on order_alone)
      parameters:
        - { name: buyer_id, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "{mandate_id, cedar, policy_ids}" }

  /policy-catalog:
    get:
      summary: What a policy editor can offer, taken from the product data
      description: Attributes with type, operators and example values; accept checks with parameters; limit keys.
      responses:
        "200": { description: Catalog }

  /mandate/draft:
    post:
      summary: "Rule from a sentence (3.1). Nothing is saved."
      description: |
        One LLM call proposes {attr, op, value} from the attributes of /policy-catalog. Valio's mandate preview
        validates it on a copy of the current mandate. Label and explanation are built from the validated rule.
        Product words ("only Finnish fish") become applies_to: category in [...]; `scope` shows which categories.
        The UI adds `rule` to its draft and signs it with PUT /mandate. Scripted provider: "No <allergen>"
        and "Only Finnish <products>" only, else 422 "Please use the form".
        Example: contracts/fixtures/mandate-draft-sesame.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, example: "No sesame, not even traces" }
                kind: { type: string, enum: [must, prefer], default: must }
                buyer_id: { type: string }
      responses:
        "200":
          description: The drafted rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, enum: [must, prefer] }
                  rule:
                    type: object
                    description: "A must (with if_unknown) or preference (with weight), ready for the mandate draft."
                  label: { type: string, example: "No sesame, incl. may contain" }
                  explanation: { type: string }
                  product_type: { type: string, nullable: true }
                  scope:
                    type: array
                    nullable: true
                    items: { type: object, properties: { category: { type: string }, share: { type: number },
                                                          products: { type: integer }, examples: { type: array, items: { type: string } } } }
                  coverage: { $ref: "#/components/schemas/RuleCoverage" }
                  provider: { type: string }
        "422": { description: "{error}: not one rule, invalid rule, or no LLM and the regexes did not match" }

  /mandate/coverage:
    post:
      summary: "How many catalog products a rule can decide from data (3.2)"
      description: |
        With `rule`: its coverage. Without: coverage for every must of the current mandate.
        Products the rule's applies_to does not match are not counted. Unknown is never counted as safe.
        Offer attributes (prices) return checked 0 and a note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rule: { type: object, description: "A condition or must, V2 shorthands accepted" }
                category: { type: string, description: "Only products of this category code" }
                buyer_id: { type: string }
      responses:
        "200":
          description: "RuleCoverage, or {mandate_id, musts: [{id, label, enabled, coverage: RuleCoverage}]}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleCoverage" }
        "422": { description: Invalid rule }

  /intents/{intent_id}/confirm:
    post:
      summary: Human confirms (or edits and confirms) the order intent. Signed by the buyer key.
      description: |
        Send the intent_hash that was displayed. If edits are sent, the server re-validates, the
        hash changes and the response carries the new intent. Only a confirmed intent can be ordered.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent_hash]
              properties:
                intent_hash: { type: string, description: "Hash the human was shown" }
                confirmed_by: { type: string, example: "chef.anna" }
                edits:
                  type: object
                  description: |
                    Optional. Returns a revised intent (status proposed, new hash) instead of confirming.
                    { items: [{item_id, quantity: {amount}, product: {query}, hard_rules, remove: true}],
                      deliver_by, hard_rules, budget: {max_total} | null, preferences }
      responses:
        "200":
          description: Confirmed intent. The agent continues in the same SSE stream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderIntent" }
        "409": { description: "Hash mismatch (the intent changed) or open questions" }

  /orders/{order_id}/verify:
    get:
      summary: Recompute hashes and check all signatures of an order's receipt
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verification" }

  # ---------- 1a: photos, phone as camera ----------
  /uploads:
    post:
      summary: Upload a photo or PDF (1a)
      description: |
        JPEG, PNG, WebP, HEIC (converted to JPEG) or PDF. Images are EXIF-rotated and downscaled to at most
        1600 px on the long edge, JPEG quality 85. Max 15 MB (PDF 10 MB). With pair_id the pairing stream
        gets `photo_received`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                buyer_id: { type: string }
                pair_id: { type: string }
                source: { type: string, enum: [upload, phone] }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/UploadMeta" } } } }
        "404": { description: Unknown or expired pair_id }
        "413": { description: Too large }
        "415": { description: Unsupported type }
  /uploads/{upload_id}:
    get:
      summary: The stored file (thumbnails in the UI)
      parameters: [{ in: path, name: upload_id, required: true, schema: { type: string } }]
      responses:
        "200": { description: The bytes, content: { image/jpeg: {}, application/pdf: {} } }
        "404": { description: Unknown upload }
  /uploads/{upload_id}/meta:
    get:
      summary: Upload metadata
      parameters: [{ in: path, name: upload_id, required: true, schema: { type: string } }]
      responses:
        "200": { description: Meta, content: { application/json: { schema: { $ref: "#/components/schemas/UploadMeta" } } } }
  /pairings:
    post:
      summary: Pair a phone as camera (1a). The frontend draws the QR code from phone_url.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                buyer_id: { type: string }
                purpose: { type: string, enum: [order, kitchen], description: "Where the desktop sends the photo (W2)" }
      responses:
        "200": { description: Pairing, content: { application/json: { schema: { $ref: "#/components/schemas/Pairing" } } } }
  /pairings/{pair_id}:
    delete:
      summary: End a pairing (the desktop closed the camera dialog). Later phone uploads get 404.
      parameters: [{ in: path, name: pair_id, required: true, schema: { type: string } }]
      responses:
        "204": { description: Ended (also when it was unknown) }
  /pairings/{pair_id}/stream:
    get:
      summary: SSE for the desktop, events `paired`, `photo_received`, `expired`. Pairings live 30 min in memory.
      parameters: [{ in: path, name: pair_id, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PairedEvent"
                  - $ref: "#/components/schemas/PhotoReceivedEvent"
        "404": { description: Unknown or expired pairing }
  /phone:
    get:
      summary: The phone camera page (HTML). Opening it emits `paired`.
      parameters: [{ in: query, name: pair, schema: { type: string } }]
      responses:
        "200": { description: HTML page, content: { text/html: {} } }

  # ---------- 1b: kitchen profile ----------
  /kitchen:
    get:
      summary: Kitchen profile plus the current mandate's Must / Prefer / Autonomy (1b)
      parameters: [{ in: query, name: buyer_id, schema: { type: string } }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/KitchenProfile"
                  - type: object
                    properties: { mandate_summary: { $ref: "#/components/schemas/MandateSummary" } }
    patch:
      summary: Edit About and the usual products directly. New profile version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buyer_id: { type: string }
                by: { type: string }
                about: { type: object, properties: { text: { type: string } } }
                usual:
                  type: object
                  properties:
                    add: { type: array, items: { $ref: "#/components/schemas/UsualProduct" }, description: "Without product_id: resolved via catalog search" }
                    update: { type: array, items: { $ref: "#/components/schemas/UsualProduct" }, description: "By id" }
                    remove: { type: array, items: { type: string }, description: "Usual ids, kept with status removed" }
      responses:
        "200": { description: New version, content: { application/json: { schema: { $ref: "#/components/schemas/KitchenProfile" } } } }
        "422": { description: Nothing to change }
  /kitchen/usual-order:
    get:
      summary: '"Your usual order" card (2c): usual products, usual amounts, last price paid'
      description: >
        Active usual products with a product and a typical amount. last_unit_price = price per usual unit (L, kg,
        piece) from the newest confirmed order line with that product; none yet → last_unit_price and estimate null.
        "Order the usual" sends POST /chat {"message": "Order the usual"}: the agent uses the same profile amounts.
      parameters: [{ in: query, name: buyer_id, schema: { type: string } }]
      responses:
        "200":
          description: The usual order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsualOrder" }
  /kitchen/history:
    get:
      summary: Profile versions with summaries, newest first
      parameters: [{ in: query, name: buyer_id, schema: { type: string } }]
      responses:
        "200": { description: History }
  /kitchen/ingest:
    post:
      summary: Read documents into suggestions (status proposed). Never orders (W2).
      description: |
        One LLM call per document, processed in order. Every suggestion quotes the document verbatim.
        Musts and preferences that Valio Aimo's mandate preview refuses are dropped, usual products are
        resolved against the catalog (token overlap >= 0.6, else candidates). Offline: fixed answers for
        the demo fixtures. An order list returns `hint` and orders nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buyer_id: { type: string }
                upload_ids: { type: array, items: { type: string } }
                text: { type: string, example: "We're a school canteen in Espoo, nut-free." }
                title: { type: string }
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary }, buyer_id: { type: string }, title: { type: string } } }
      responses:
        "200":
          description: One result per document (a single document's result is also merged into the top level)
          content:
            application/json:
              schema:
                type: object
                properties:
                  buyer_id: { type: string }
                  results: { type: array, items: { $ref: "#/components/schemas/IngestResult" } }
  /kitchen/suggestions/accept:
    post:
      summary: Accept suggestions. Must / Prefer / Autonomy need a signed mandate version.
      description: |
        About and Usual are applied to the profile. If the batch has must, prefer or autonomy items, the
        backend builds the new mandate and previews it: without mandate_hash (or with an outdated one) the
        answer is 409 NeedsSignature and nothing is applied. With the previewed hash the backend signs and
        stores the mandate, then applies the rest. One request = one mandate version + one profile version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                buyer_id: { type: string }
                ids: { type: array, items: { type: string } }
                by: { type: string, example: "Anna Virtanen" }
                mandate_hash: { type: string }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/KitchenProfile" }
                  mandate: { $ref: "#/components/schemas/MandateSummary" }
                  accepted: { type: array, items: { type: string } }
        "409": { description: "needs_signature (show preview, resend with its mandate_hash) or already decided", content: { application/json: { schema: { $ref: "#/components/schemas/NeedsSignature" } } } }
        "422": { description: Valio Aimo refused the new mandate }
  /kitchen/suggestions/{suggestion_id}/reject:
    post:
      summary: Reject a suggestion. It stays in the list with status rejected.
      parameters: [{ in: path, name: suggestion_id, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { buyer_id: { type: string }, by: { type: string } } } } }
      responses:
        "200": { description: New profile version, content: { application/json: { schema: { $ref: "#/components/schemas/KitchenProfile" } } } }
        "409": { description: Already decided }

  # ---------- 2b: orders and autonomy ----------
  /orders:
    get:
      summary: Recent orders, newest first, with a label for the start screen (2b)
      parameters:
        - { in: query, name: buyer_id, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: before, schema: { type: string }, description: "order_id or timestamp, for paging" }
      responses:
        "200": { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrderSummary" } } } } }
  /autonomy:
    get:
      summary: Autonomy level, clean-order counter and grants (2b)
      parameters: [{ in: query, name: buyer_id, schema: { type: string } }]
      responses:
        "200": { description: State, content: { application/json: { schema: { $ref: "#/components/schemas/AutonomyState" } } } }
  /autonomy/level:
    post:
      summary: Change the level (0 suggest, 1 usual products, 2 within mandate). Signature round trip as in accept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                buyer_id: { type: string }
                level: { type: integer, enum: [0, 1, 2] }
                max_order_total: { type: number, description: "Default: keep the current one (else 600)" }
                by: { type: string }
                mandate_hash: { type: string }
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/AutonomyState" } } } }
        "409": { description: needs_signature, content: { application/json: { schema: { $ref: "#/components/schemas/NeedsSignature" } } } }
        "422": { description: "Level 3, or level 1 without usual products" }
  /autonomy/sync-usual:
    post:
      summary: Put the current usual products into the level-1 grant ("Update your usual products in the grant")
      requestBody:
        content: { application/json: { schema: { type: object, properties: { buyer_id: { type: string }, by: { type: string }, mandate_hash: { type: string } } } } }
      responses:
        "200": { description: "New state, `changed` false if already in sync", content: { application/json: { schema: { $ref: "#/components/schemas/AutonomyState" } } } }
        "409": { description: needs_signature, or the level is not 1 }

components:
  schemas:
    ChatRequest:
      type: object
      properties:
        message: { type: string, example: "I need 1,000 litres of lactose-free milk by Monday.", description: "May be empty when a photo is attached" }
        attachments:
          type: array
          description: "Photos or PDFs from POST /uploads (1a). Sent to the model on this turn only."
          items: { type: object, required: [upload_id], properties: { upload_id: { type: string, example: up_3f9a1c2d } } }
        session_id: { type: string, nullable: true }
        buyer_id: { type: string, example: "hotel-chain-helsinki", description: "Which buyer mandate/policy applies" }

    ChatResponse:
      type: object
      required: [session_id]
      properties:
        session_id: { type: string, example: "sess_01" }

    # ---------- shared objects ----------
    Offer:
      type: object
      required: [product_id, name, unit_price, currency, quantity, total_price, available_amount, available_date]
      properties:
        product_id: { type: string, example: "6409100" }
        name: { type: string, example: "Valio Eila lactose-free milk drink 1.5% 1 L" }
        rank: { type: string, enum: [best, better, good], nullable: true, description: "Substitution ranking" }
        is_substitute: { type: boolean, default: false }
        substitute_reason: { type: string, nullable: true }
        sales_unit: { type: string, example: "L" }
        quantity: { type: number, example: 1000 }
        unit_price: { type: number, example: 1.29 }
        total_price: { type: number, example: 1290.0 }
        currency: { type: string, example: "EUR" }
        comparison_price: { type: number, nullable: true }
        comparison_unit: { type: string, enum: [KG, L], nullable: true }
        available_amount: { type: number, description: "999999 means terminal product, quantity unknown" }
        available_date: { type: string, format: date }
        requested_date: { type: string, format: date }
        closing_time: { type: string, format: date-time, description: "Order cut-off" }
        logistic_model: { type: string, enum: [stock, terminal] }
        delivery_reliability: { type: number, nullable: true, minimum: 0, maximum: 1 }
        co2_kg_per_kg: { type: number, nullable: true, description: "Category average, not product measurement" }
        certificates: { type: array, items: { type: string } }
        allergens: { type: array, items: { type: string } }
        usual: { type: boolean, description: "The buyer's usual product for this item (1c). Ranked first if it can deliver and breaks no rule" }
        preference_score: { type: number }
        quote_id: { type: string, description: "Binds the order to this fixed price" }
        item_id: { type: string, description: "The intent item this quote is for" }
        quote_expires_at: { type: string, format: date-time }
        evidence:
          type: array
          description: "Per hard rule of the confirmed intent: verdict plus the data that proves it"
          items: { $ref: "#/components/schemas/RuleEvidence" }
        provenance: { $ref: "#/components/schemas/Provenance" }

    PolicyCheck:
      type: object
      properties:
        rule: { type: string, example: "autonomy" }
        passed: { type: boolean }
        detail: { type: string, example: "A human must sign: g1 Orders anything alone up to 1,000 EUR: 1,199.52 over its limit 1,000.00" }

    Approval:
      type: object
      required: [approval_id, order_id, status, reason, total_price, currency, lines]
      properties:
        approval_id: { type: string }
        order_id: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string }
        policy_checks: { type: array, items: { $ref: "#/components/schemas/PolicyCheck" } }
        lines: { type: array, items: { $ref: "#/components/schemas/Offer" } }
        total_price: { type: number }
        currency: { type: string }
        agent_rationale: { type: string }
        created_at: { type: string, format: date-time }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        comment: { type: string, nullable: true }
        tier: { type: string, enum: [auto, ask, block] }
        diff: { $ref: "#/components/schemas/Diff" }
        cart_hash: { type: string }
        intent: { $ref: "#/components/schemas/OrderIntent" }

    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        comment: { type: string }
        decided_by: { type: string, example: "chef.anna" }
        cart_hash: { type: string, description: "Required for approve: the hash the human was shown. Mismatch = 409." }

    AuditEntry:
      type: object
      required: [timestamp, actor, action, summary]
      properties:
        timestamp: { type: string, format: date-time }
        actor: { type: string, enum: [buyer_agent, valio_mcp, human, policy_engine] }
        action: { type: string, example: "check_offer" }
        summary: { type: string, example: "Checked price and availability for 3 lactose-free milk products for 2026-11-16" }
        reason: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }


    # ---------- v0.2 trust objects ----------
    RuleCoverage:
      type: object
      description: "Verdicts of one rule over the catalog. checked = known + unknown, known = safe + excluded."
      properties:
        label: { type: string }
        checked: { type: integer, example: 17546 }
        known: { type: integer, example: 9300 }
        safe: { type: integer, example: 8544 }
        excluded: { type: integer, example: 756 }
        unknown: { type: integer, example: 8246 }
        category: { type: string, nullable: true }
        if_unknown: { type: string, enum: [exclude, ask] }
        rule_hash: { type: string, description: "Cache key" }
        note: { type: string, description: "Only for rules that need a price" }
    Condition:
      type: object
      description: |
        A condition over product data. Attributes and operators: GET /policy-catalog. No fixed rule kinds:
        any attribute the data has can be used. Unknown data = verdict unknown.
      required: [attr, op, value]
      properties:
        attr: { type: string, example: country, enum: [product_id, name, brand, vendor, category, country, labels, claims, allergens, allergens_contains, allergens_free_from, lactose_free, delivery_reliability, co2_kg_per_kg, unit_price, comparison_price, line_total] }
        op: { type: string, enum: [eq, ne, in, not_in, contains, not_contains, lt, lte, gt, gte] }
        value: { description: "string, number, boolean or list (in / not_in)", example: fi }

    HardRule:
      description: |
        A must (mandate or request). A condition plus id and label. V2 shorthands are accepted on input and kept
        on output: {rule: lactose_free}, {rule: exclude_allergen, allergen, strictness}, {rule: origin, country}.
      allOf:
        - $ref: "#/components/schemas/Condition"
        - type: object
          properties:
            id: { type: string, example: m1, description: "m* mandate, r* request, <item>_r* item" }
            label: { type: string, example: "no peanuts incl. 'may contain'" }
            if_unknown: { type: string, enum: [exclude, ask], default: exclude, description: "ask = keep the product, a human decides" }
            applies_to: { type: array, items: { $ref: "#/components/schemas/Condition" }, description: "Only for products matching all of these" }
            enabled: { type: boolean, default: true }
            source: { type: string, example: mandate, description: "mandate rules cannot be edited away" }
            rule: { type: string, enum: [lactose_free, exclude_allergen, origin, condition], description: V2 shorthand }
            allergen: { type: string }
            strictness: { type: string, enum: [contains, contains_or_may_contain] }
            country: { type: string }

    Preference:
      allOf:
        - $ref: "#/components/schemas/Condition"
        - type: object
          properties:
            id: { type: string, example: p1 }
            label: { type: string }
            weight: { type: integer, minimum: 1, maximum: 3, description: "Ranking: offers sorted by sum of weights met" }
            enabled: { type: boolean, default: true }

    Grant:
      type: object
      description: Inside this scope, up to these limits, the agent may accept these deviations on its own.
      properties:
        id: { type: string, example: g1 }
        label: { type: string, example: "Orders origin FI alone up to 2,000 EUR, may accept quantity" }
        scope: { type: array, items: { $ref: "#/components/schemas/Condition" }, description: "All must hold. Empty = every line" }
        limits:
          type: object
          properties:
            max_order_total: { type: number, description: "Summed over the lines assigned to this grant" }
            max_line_total: { type: number }
            max_unit_price: { type: number }
        accepts:
          type: array
          items:
            type: object
            properties:
              check: { type: string, enum: [quantity, delivery_date, preference, product, usual, budget, availability], description: "usual: another product than the buyer's usual one (1c)" }
              max_over_pct: { type: number, description: "quantity only" }
              max_days_late: { type: integer, description: "delivery_date only" }
              id: { type: string, description: "preference only: which preference, empty = all" }
        enabled: { type: boolean, default: true }

    MandateUpdate:
      type: object
      required: [mandate]
      properties:
        mandate:
          type: object
          description: "{display_name, currency, optimise, mandatory_rules: [HardRule], preferences: [Preference], autonomy: {grants: [Grant]}}"
        buyer_id: { type: string }
        updated_by: { type: string }
        mandate_hash: { type: string, description: "From /mandate/preview, what the human saw" }

    OrderIntent:
      type: object
      description: |
        One request = one intent with one or more items (a single product, or everything a recipe needs).
        Each item can be bought exactly once. Items may be ordered together or in several orders.
      required: [intent_id, status, items, deliver_by, hard_rules, readback, chips, questions]
      properties:
        intent_id: { type: string, example: "int_9f2c1a7b" }
        status: { type: string, enum: [proposed, confirmed, fulfilled, superseded, expired], description: "fulfilled = every item ordered" }
        buyer_id: { type: string }
        mandate_id: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/IntentItem" } }
        deliver_by: { type: string, format: date }
        hard_rules: { type: array, description: "Apply to ALL items (mandate rules plus request-wide)", items: { $ref: "#/components/schemas/HardRule" } }
        spent: { type: number, description: "Sum of orders placed against this intent" }
        order_ids: { type: array, items: { type: string } }
        preferences:
          type: object
          properties:
            optimise: { type: string, enum: [price, reliability, co2] }
            origin: { type: string, nullable: true }
        budget: { type: object, nullable: true, properties: { max_total: { type: number }, currency: { type: string } } }
        readback: { type: string, example: "1,000 L lactose-free milk, delivered by Mon 16 Nov 2026, cheapest that delivers in full." }
        chips:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              label: { type: string, example: "120 L milk → your usual: Valio Eila® semi skimmed milk drink 10 l novobox lactose free" }
              locked: { type: boolean }
              usual: { type: object, properties: { product_id: { type: string }, name: { type: string } }, description: "Item chips only: the 'Your usual' chip" }
        notes: { type: array, items: { type: string }, description: "E.g. a usual product id that is not in the catalog was ignored" }
        questions: { type: array, items: { type: string }, description: "Non-empty = cannot be confirmed yet" }
        intent_hash: { type: string, description: "SHA-256 over RFC 8785 canonical JSON of the binding fields" }
        buyer_signature: { type: string, nullable: true, description: "Ed25519, base64url" }
        confirmed_by: { type: string, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time }

    IntentItem:
      type: object
      properties:
        item_id: { type: string, example: "i1" }
        product:
          type: object
          description: "Signed. preferred_product_id is the buyer's usual product (1c), part of the intent hash"
          properties:
            query: { type: string, example: "milk" }
            preferred_product_id: { type: string, example: "463038" }
        usual: { type: object, nullable: true, description: "Not signed, for display", properties: { product_id: { type: string }, name: { type: string } } }
        quantity:
          type: object
          properties:
            amount: { type: number, example: 1000 }
            unit: { type: string, enum: [L, KG, SALES_UNIT] }
            max_over_pct: { type: number, example: 2, description: "Rounding up to whole packs allowed up to this % over" }
            allow_under: { type: boolean, default: false }
        hard_rules: { type: array, description: "Rules for this item only", items: { $ref: "#/components/schemas/HardRule" } }
        note: { type: string, nullable: true }
        status: { type: string, enum: [open, ordered] }
        order_id: { type: string, nullable: true }

    RuleEvidence:
      type: object
      properties:
        rule: { type: string, example: "lactose_free" }
        verdict: { type: string, enum: [safe, excluded, unknown] }
        signals:
          type: array
          items:
            type: object
            properties:
              source: { type: string, enum: [gs1, ingredients, claim, name, catalog] }
              field: { type: string, example: "allergen.ML" }
              value: { type: string, example: "FREE_FROM" }
              says: { type: string, enum: [safe, excluded] }

    Provenance:
      type: object
      properties:
        source: { type: string, example: "Valio Aimo API /api/price + /api/availability" }
        fetched_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        signature: { type: string, description: "Valio Aimo Ed25519 signature over the quote" }
        key_id: { type: string }

    DiffCheck:
      type: object
      properties:
        field: { type: string, enum: [product, hard_rules, preference, quantity, delivery_date, budget, autonomy, quote_valid, quote_signature, order_cutoff, availability, binding, usual], description: "usual (1c): the cart has another product than the buyer's usual one" }
        item_id: { type: string, nullable: true, description: "Line check for this item. Null = whole cart (budget, autonomy)" }
        pref_id: { type: string, description: "preference checks: which preference" }
        grants_used: { type: array, items: { type: string }, description: "autonomy check: the grants that let the agent order alone" }
        intended: { type: string, example: "1,000 L" }
        cart: { type: string, example: "1,008 L (84 × 12 L)" }
        ok: { type: boolean }
        severity: { type: string, enum: [none, ask, block] }
        detail: { type: string }

    Diff:
      type: object
      properties:
        deviations: { type: integer, example: 0, description: "Failed checks, autonomy not counted" }
        checks: { type: array, items: { $ref: "#/components/schemas/DiffCheck" } }
        accepted: { type: array, items: { type: string }, example: ["preference:p1"], description: "Tier auto: deviations a grant accepted" }

    Receipt:
      type: object
      properties:
        order_id: { type: string }
        intent_hash: { type: string }
        cart_hash: { type: string }
        mandate_id: { type: string, example: mandate_juvenes_v2, description: "The mandate version that decided" }
        mandate_hash: { type: string }
        grants_used: { type: array, items: { type: string }, description: "Tier auto: the grants that allowed it" }
        buyer_intent_signature: { type: string }
        buyer_cart_signature: { type: string, nullable: true, description: "Only when a human approved (tier ask)" }
        valio_signature: { type: string }
        fingerprint: { type: string, example: "7F3A-91C2", description: "Short form of cart_hash for display" }
        verify_url: { type: string }

    Verification:
      type: object
      properties:
        order_id: { type: string }
        valid: { type: boolean }
        checks: { type: array, items: { type: object, properties: { name: { type: string }, ok: { type: boolean }, detail: { type: string } } } }

    Mandate:
      type: object
      properties:
        buyer_id: { type: string }
        version: { type: integer }
        mandate_id: { type: string, example: mandate_juvenes_v2 }
        mandate_hash: { type: string }
        fingerprint: { type: string }
        display_name: { type: string }
        currency: { type: string }
        optimise: { type: string, enum: [price, reliability, co2], description: "After preferences" }
        mandatory_rules: { type: array, items: { $ref: "#/components/schemas/HardRule" }, description: "MUST: broken -> block" }
        preferences: { type: array, items: { $ref: "#/components/schemas/Preference" }, description: "PREFER: ranking, a miss asks unless a grant accepts it" }
        autonomy:
          type: object
          description: "AUTONOMY: no grants = every order needs a human signature"
          properties:
            grants: { type: array, items: { $ref: "#/components/schemas/Grant" } }
        summary: { type: string, description: Plain text of all three levels }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
        signature: { type: string, nullable: true, description: "Buyer Ed25519 over mandate_hash (null for the seeded v1)" }
        cedar: { type: string, description: "Preview only: generated Cedar policies" }

    IntentProposedEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: intent_proposed }
            intent: { $ref: "#/components/schemas/OrderIntent" }

    IntentConfirmedEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: intent_confirmed }
            intent: { $ref: "#/components/schemas/OrderIntent" }

    OrderRejectedEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: order_rejected }
            order_id: { type: string }
            tier: { const: block }
            diff: { $ref: "#/components/schemas/Diff" }
            message: { type: string }

    # ---------- SSE events ----------
    EventBase:
      type: object
      required: [type, session_id, timestamp]
      properties:
        type: { type: string }
        session_id: { type: string }
        timestamp: { type: string, format: date-time }

    ReasoningEvent:
      description: One LLM call. Emitted before the message / tool calls that this call produced.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: reasoning }
            step: { type: integer, description: "LLM call number within this turn" }
            model: { type: string }
            text: { type: string, nullable: true, description: "Model's summarized thinking, null if none" }
            tool_calls: { type: array, items: { type: string }, description: "Tools the model decided to call" }
            usage: { type: object, additionalProperties: true }
            duration_ms: { type: integer }

    MessageEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: message }
            role: { type: string, enum: [assistant] }
            text: { type: string, description: "Markdown allowed" }

    ToolCallEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: tool_call }
            call_id: { type: string }
            step: { type: integer, description: "LLM call that requested this tool" }
            tool: { type: string, example: "check_offer" }
            label: { type: string, description: "Human-readable, show this in the UI", example: "Checking price and availability for 3 products" }
            args: { type: object, additionalProperties: true }
            side: { type: string, enum: [valio, buyer], description: "valio = Valio Aimo MCP tool; buyer = runs in this backend and only creates suggestions (2a)" }

    ToolResultEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: tool_result }
            call_id: { type: string }
            tool: { type: string }
            ok: { type: boolean }
            summary: { type: string }
            result: { type: object, additionalProperties: true, description: "Full tool output" }
            duration_ms: { type: integer }
            side: { type: string, enum: [valio, buyer] }

    OffersEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: offers }
            request_summary: { type: string }
            offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
            recommended_product_id: { type: string, nullable: true }
            item_id: { type: string }
            product_query: { type: string }
            excluded:
              type: array
              description: "Rejected options, one line each, e.g. 'Valio X 1 L: contains milk (GS1 AM CONTAINS)'"
              items: { type: object, properties: { product_id: { type: string }, name: { type: string }, reason: { type: string }, rule_id: { type: string }, usual: { type: boolean, description: "The usual product broke a rule (e.g. label changed: may contain nuts)" } } }
            funnel:
              type: array
              description: "How I narrowed it down: catalog matches, then one step per must in mandate order, then available, usual or preferences, pick. Each count <= the previous"
              items: { $ref: "#/components/schemas/FunnelStep" }
            usual_product: { type: object, nullable: true, description: "Only on the empty offer card", properties: { product_id: { type: string }, name: { type: string }, allowed: { type: boolean }, reason: { type: string, nullable: true } } }

    ApprovalRequiredEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: approval_required }
            approval: { $ref: "#/components/schemas/Approval" }

    OrderConfirmedEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: order_confirmed }
            order_id: { type: string }
            status: { type: string, enum: [confirmed] }
            lines: { type: array, items: { $ref: "#/components/schemas/Offer" } }
            total_price: { type: number }
            currency: { type: string }
            delivery_date: { type: string, format: date }
            approved_by: { type: string, nullable: true, description: "null if placed autonomously" }
            items_open_after: { type: array, items: { type: string }, description: "Intent items still to be ordered" }
            tier: { type: string, enum: [auto, ask] }
            diff: { $ref: "#/components/schemas/Diff" }
            receipt: { $ref: "#/components/schemas/Receipt" }

    ErrorEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: error }
            message: { type: string }
            recoverable: { type: boolean }

    DoneEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: done }

    FunnelStep:
      type: object
      properties:
        step: { type: string, enum: [catalog, must, rule, available, usual, prefer, pick] }
        rule_id: { type: string, nullable: true }
        label: { type: string, example: "no peanuts incl. 'may contain'" }
        count: { type: integer }

    UserMessageEvent:
      description: The buyer's message as sent, with photos (so a second screen can show them)
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: user_message }
            text: { type: string }
            attachments:
              type: array
              items: { type: object, properties: { upload_id: { type: string }, url: { type: string }, media_type: { type: string }, filename: { type: string } } }

    AutonomyProgressEvent:
      description: After order_confirmed (2b). Toast "Clean order. 7 of 10 towards level 2"
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: autonomy_progress }
            order_id: { type: string }
            clean: { type: boolean }
            reason: { type: string, example: "Clean order" }
            clean_orders: { type: integer }
            needed: { type: integer }
            offer_next: { type: boolean }
            level: { type: integer }
            name: { type: string }

    ContextSuggestionEvent:
      description: >
        2a: the agent proposes something to remember (status proposed, nothing is active). after_order: at most one
        per order, "Remember" = POST /kitchen/suggestions/accept, "Just this time" = POST /kitchen/suggestions/{id}/reject.
        from_chat: remember_about_kitchen. from_photo: learn_from_document. Must / prefer need a signature on accept.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type: { const: context_suggestion }
            reason: { type: string, enum: [after_order, from_chat, from_photo] }
            order_id: { type: string, description: "Only for after_order" }
            suggestions: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }

    UsualOrder:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              word: { type: string, example: milk }
              product_id: { type: string }
              product_name: { type: string, nullable: true }
              quantity: { type: number, example: 120 }
              unit: { type: string, example: L }
              last_unit_price: { type: number, nullable: true, example: 1.09 }
              estimate: { type: number, nullable: true, example: 130.8 }
        estimate_total: { type: number, nullable: true, description: "Sum of the known estimates" }
        estimate_complete: { type: boolean, description: "Every item has an estimate" }
        deliver_by: { type: string, format: date, description: "Next Monday" }
        based_on: { type: string, example: "your usual amounts per week" }
        kitchen_profile_version: { type: integer }

    PairedEvent:
      type: object
      properties:
        type: { const: paired }
        pair_id: { type: string }
        purpose: { type: string, enum: [order, kitchen] }

    PhotoReceivedEvent:
      type: object
      properties:
        type: { const: photo_received }
        pair_id: { type: string }
        upload_id: { type: string }
        url: { type: string, example: "/uploads/up_3f9a1c2d" }
        media_type: { type: string }
        purpose: { type: string, enum: [order, kitchen] }

    UploadMeta:
      type: object
      properties:
        upload_id: { type: string, example: up_3f9a1c2d }
        media_type: { type: string, enum: [image/jpeg, application/pdf] }
        filename: { type: string }
        bytes: { type: integer }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        buyer_id: { type: string }
        source: { type: string, enum: [upload, phone] }
        pair_id: { type: string, nullable: true }
        url: { type: string }
        text: { type: string, description: "Demo fixtures only: what the document says (scripted provider)" }
        fixture: { type: string, description: "Demo fixtures only" }

    Pairing:
      type: object
      properties:
        pair_id: { type: string, example: pair_8c1d }
        phone_url: { type: string, example: "http://192.168.1.20:8000/phone?pair=pair_8c1d" }
        purpose: { type: string, enum: [order, kitchen] }
        expires_at: { type: string, format: date-time }

    UsualProduct:
      type: object
      properties:
        id: { type: string, example: u1 }
        word: { type: string, example: milk }
        aliases: { type: array, items: { type: string }, example: [maito] }
        product_id: { type: string, nullable: true, example: "463038" }
        product_name: { type: string, nullable: true }
        product_query: { type: string, description: "Input only: name as written, resolved via catalog search" }
        typical_qty: { type: number, example: 120 }
        unit: { type: string, enum: [L, KG, SALES_UNIT] }
        per: { type: string, example: week }
        source_id: { type: string }
        status: { type: string, enum: [active, replaced, removed] }

    Source:
      type: object
      properties:
        id: { type: string, example: s1 }
        type: { type: string, enum: [photo, pdf, text, order, correction] }
        title: { type: string, example: "Lunch menu, week 47" }
        upload_id: { type: string, nullable: true }
        order_id: { type: string, nullable: true }
        document_type: { type: string }
        created_at: { type: string, format: date-time }

    Suggestion:
      type: object
      properties:
        id: { type: string, example: sg4 }
        kind: { type: string, enum: [about, usual, must, prefer, autonomy] }
        status: { type: string, enum: [proposed, accepted, rejected] }
        title: { type: string, example: "No peanuts or tree nuts, including \"may contain\"" }
        quote: { type: string, description: "Verbatim from the source (W1)" }
        source_id: { type: string }
        payload:
          type: object
          description: |
            about {text} or {fact}; usual {word, aliases, product_id, product_name, product_query, typical_qty, unit, per,
            candidates?}; must {attr, op, value (a list = one rule per value), if_unknown?, applies_to?, label?};
            prefer {attr, op, value, weight}; autonomy {scope ("usual" = the usual products) | [Condition], limits, accepts?}
        mandate_version: { type: integer, nullable: true, description: "Set when a signed kind was accepted" }

    KitchenProfile:
      type: object
      properties:
        buyer_id: { type: string }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        about:
          type: object
          properties:
            text: { type: string }
            facts: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, source_id: { type: string } } } }
        usual: { type: array, items: { $ref: "#/components/schemas/UsualProduct" } }
        suggestions: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }
        sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
        history: { type: array, items: { type: object, properties: { version: { type: integer }, at: { type: string }, by: { type: string }, summary: { type: string } } } }

    MandateSummary:
      type: object
      properties:
        mandate_id: { type: string }
        version: { type: integer }
        fingerprint: { type: string }
        must: { type: array, items: { type: object } }
        prefer: { type: array, items: { type: object } }
        autonomy: { type: array, items: { type: object } }
        summary: { type: string }

    IngestResult:
      type: object
      properties:
        source: { $ref: "#/components/schemas/Source" }
        document_type: { type: string, enum: [menu, allergy_note, invoice, order_list, sustainability_report, other] }
        suggestions: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }
        hint: { type: string, description: "order_list only: send it in the Order tab" }
        note: { type: string, description: "Why nothing was read, if so" }

    NeedsSignature:
      type: object
      properties:
        detail:
          type: object
          properties:
            needs_signature: { const: true }
            preview:
              type: object
              properties:
                mandate: { type: object }
                mandate_hash: { type: string, description: "Send this back to sign and store" }
                version: { type: integer }
                fingerprint: { type: string }
                summary: { type: string }
                cedar: { type: string }
                diff: { type: array, items: { type: string }, example: ["Add must: No peanuts or tree nuts, including \"may contain\" (from Allergy note)"] }

    OrderSummary:
      type: object
      properties:
        order_id: { type: string }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [confirmed, pending_approval, rejected, quote_expired] }
        tier: { type: string, enum: [auto, ask, block] }
        total: { type: number }
        currency: { type: string }
        lines: { type: integer }
        title: { type: string, description: "Item queries joined, max 60 characters" }
        decided_by: { type: string, nullable: true }
        blocked_rules: { type: array, items: { type: string } }
        blocked_labels: { type: array, items: { type: string } }
        blocked_lines: { type: integer }
        asked_lines: { type: integer }
        mandate_version: { type: integer }
        grants_used: { type: array, items: { type: string } }
        intent_id: { type: string }
        intent_revised: { type: boolean }
        product_changed: { type: boolean }
        label: { type: string, example: "Ordered alone", description: "Ordered alone | You decided N | N line(s) blocked (rule) | Waiting for you | You rejected it | Quote expired" }
        clean: { type: boolean }
        clean_reason: { type: string }
        kitchen_profile_version: { type: integer, description: "2c, only while the backend knows it" }

    AutonomyState:
      type: object
      properties:
        level: { type: integer, enum: [0, 1, 2] }
        name: { type: string, example: "Usual products" }
        clean_orders: { type: integer, description: "Since the last level change" }
        needed: { type: integer, example: 10 }
        offer_next: { type: boolean }
        since: { type: string, nullable: true }
        mandate_version: { type: integer }
        grants: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, summary: { type: string }, scope: { type: string } } } }
        levels: { type: array, items: { type: object, properties: { level: { type: integer }, name: { type: string }, locked: { type: boolean } } } }
        usual_scope:
          type: object
          properties:
            in_sync: { type: boolean }
            missing: { type: array, items: { type: string }, description: "Usual products not in the level-1 grant" }
            extra: { type: array, items: { type: string } }
            grant_id: { type: string, nullable: true }
