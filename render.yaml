# Render Blueprint: dashboard -> New -> Blueprint -> this repo.
# Free plan: sleeps after 15 min without traffic (about 1 min to wake), data resets on every restart.
services:
  - type: web
    name: valiovalue
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APPROVER_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: scripted          # anthropic | openai | gemini | openai_compatible | scripted
      - key: DEFAULT_BUYER_ID
        value: school-kitchen-espoo
      - key: VALIO_API_KEY       # empty = offline fake Valio API
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
